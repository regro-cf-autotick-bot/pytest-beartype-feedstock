{% set version = "0.3.0" %}

package:
  name: pytest-beartype
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/p/pytest-beartype/pytest_beartype-{{ version }}.tar.gz
  sha256: ff116d14a01f7f49f229e77c1e030fcc6b6305deaca6d54d66e5cb7014630d62

build:
  number: 0
  noarch: python
  script:
    - {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools
  run:
    - beartype >=0.19.0
    - pytest
    - python >={{ python_min }}

test:
  source_files:
    - tests
  requires:
    - coverage
    - mypy
    - pip
    - pytest
    - python {{ python_min }}
  imports:
    - pytest_beartype
  commands:
    - pip check
    - mypy -p pytest_beartype

about:
  home: https://github.com/tusharsadhwani/pytest-beartype
  summary: Pytest plugin to run your tests with beartype checking enabled.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - bollwyvl
    - tusharsadhwani
